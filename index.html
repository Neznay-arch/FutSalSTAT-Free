<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal Stat - Статистика мини-футбола</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Экран создания нового матча -->
        <section id="screen-new-match" class="screen">
            <h1>Новый матч</h1>
            
            <div class="team-section">
                <div class="form-group">
                    <label>Команда 1</label>
                    <input type="text" id="team1-name-input" placeholder="Название команды 1" value="">
                </div>
                
                <div class="players-section">
                    <h3 id="team1-header">Команда 1</h3>
                    <div id="team1-players-list" class="players-list"></div>
                    
                    <button type="button" class="btn btn-add-player" data-action="show-add-player" data-team="team1">+ Добавить игрока</button>
                    
                    <div id="team1-add-form" class="player-form hidden">
                        <input type="text" name="name" placeholder="Имя игрока" maxlength="30">
                        <input type="number" name="number" placeholder="Номер (опционально)" min="1" max="99">
                        <div class="player-form-buttons">
                            <button type="button" class="btn btn-save-player" data-action="add-player" data-team="team1">Сохранить</button>
                            <button type="button" class="btn btn-cancel-player" data-action="hide-add-player" data-team="team1">Отмена</button>
                        </div>
                    </div>
                    
                    <p class="players-count" id="team1-count">0 игроков</p>
                </div>
            </div>
            
            <div class="team-section">
                <div class="form-group">
                    <label>Команда 2</label>
                    <input type="text" id="team2-name-input" placeholder="Название команды 2" value="">
                </div>
                
                <div class="players-section">
                    <h3 id="team2-header">Команда 2</h3>
                    <div id="team2-players-list" class="players-list"></div>
                    
                    <button type="button" class="btn btn-add-player" data-action="show-add-player" data-team="team2">+ Добавить игрока</button>
                    
                    <div id="team2-add-form" class="player-form hidden">
                        <input type="text" name="name" placeholder="Имя игрока" maxlength="30">
                        <input type="number" name="number" placeholder="Номер (опционально)" min="1" max="99">
                        <div class="player-form-buttons">
                            <button type="button" class="btn btn-save-player" data-action="add-player" data-team="team2">Сохранить</button>
                            <button type="button" class="btn btn-cancel-player" data-action="hide-add-player" data-team="team2">Отмена</button>
                        </div>
                    </div>
                    
                    <p class="players-count" id="team2-count">0 игроков</p>
                </div>
            </div>
            
            <div class="form-group">
                <label>Длительность периода (мин)</label>
                <input type="number" id="period-duration" value="20" min="1" max="60">
            </div>
            
            <button type="button" class="btn btn-primary" data-action="start-match">Начать матч</button>
        </section>

        <!-- Экран матча -->
        <section id="screen-match" class="screen hidden">
            <div class="scoreboard">
                <div class="team team1">
                    <h2 id="team1-name">Команда 1</h2>
                    <div class="score" id="score-team1">0</div>
                    <button class="btn btn-goal" data-action="open-goal-modal" data-team="team1">+1 гол</button>
                </div>
                
                <div class="timer-section">
                    <div class="timer" id="timer-display">20:00</div>
                    <div class="period" id="period-display">1 период</div>
                    <button class="btn btn-pause" id="btn-toggle-timer" data-action="toggle-timer">Пауза</button>
                </div>
                
                <div class="team team2">
                    <h2 id="team2-name">Команда 2</h2>
                    <div class="score" id="score-team2">0</div>
                    <button class="btn btn-goal" data-action="open-goal-modal" data-team="team2">+1 гол</button>
                </div>
            </div>
            
            <div class="match-actions">
                <button class="btn btn-stats" data-action="open-stats">Статистика</button>
                <button class="btn btn-substitution" data-action="open-subs-modal" data-team="team1">Замены (К1)</button>
                <button class="btn btn-substitution" data-action="open-subs-modal" data-team="team2">Замены (К2)</button>
                <button class="btn btn-finish" data-action="finish-match">Завершить матч</button>
            </div>
        </section>

        <!-- Экран статистики -->
        <section id="screen-stats" class="screen hidden">
            <div class="stats-header">
                <h2>Статистика игроков</h2>
                <button class="btn btn-back" data-action="back-to-match">← Назад к матчу</button>
            </div>
            
            <div id="stats-content" class="stats-content">
                <!-- Заполняется JS -->
            </div>
        </section>
    </div>

    <!-- Универсальный контейнер модальных окон -->
    <div id="modal-container" class="modal hidden"></div>

    <script src="app.js"></script>
</body>
</html>
